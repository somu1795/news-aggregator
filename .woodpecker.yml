workspace:
  base: /woodpecker
  path: src/${CI_REPO_OWNER}/${CI_REPO_NAME}

when:
  branch: [main, test-woodpecker]
  event: [push, manual]

labels:
  build-machine: true

steps:
  - name: test
    image: python:3.14.8-slim-trixie
    commands:
      - cd app
      - pip install --no-cache-dir -r requirements-dev.txt
      - python -m pytest -q

  - name: test-tagger
    image: python:3.12-slim-bookworm
    commands:
      - cd tagger
      - pip install --no-cache-dir -r requirements.txt pytest
      - python -m pytest -q

  - name: build-images-with-compose
    image: docker:29.9.0-cli
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ADMIN_API_KEY:
        from_secret: ADMIN_API_KEY
      API_RATE_LIMIT:
        from_secret: API_RATE_LIMIT
      UVICORN_WORKERS:
        from_secret: UVICORN_WORKERS
      ALLOWED_HOSTS:
        from_secret: ALLOWED_HOSTS
    commands:
      - |
        set -e
        echo "Generating .env file..."
        cat <<EOF > .env
        ALLOWED_HOSTS=${ALLOWED_HOSTS}
        ADMIN_API_KEY=${ADMIN_API_KEY}
        API_RATE_LIMIT=${API_RATE_LIMIT}
        UVICORN_WORKERS=${UVICORN_WORKERS}
        EOF
        docker compose build

  - name: tag-and-push-images
    image: docker:29.9.0-cli
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY:
        from_secret: REGISTRY
    commands:
      - |
        set -e
        export COMPOSE_IMAGE_APP=news-aggregator-app
        export COMPOSE_IMAGE_CADDY=news-aggregator-caddy
        export COMPOSE_IMAGE_TAGGER=news-aggregator-tagger
        SHORT_TAG=$(echo ${CI_COMMIT_SHA} | cut -c1-7)
        echo "Using IMAGE_TAG=$SHORT_TAG"
        echo "Registry: $REGISTRY"

        docker tag ${COMPOSE_IMAGE_APP}:latest ${REGISTRY}/${COMPOSE_IMAGE_APP}:${SHORT_TAG}
        docker tag ${COMPOSE_IMAGE_APP}:latest ${REGISTRY}/${COMPOSE_IMAGE_APP}:latest
        docker push ${REGISTRY}/${COMPOSE_IMAGE_APP}:${SHORT_TAG}
        docker push ${REGISTRY}/${COMPOSE_IMAGE_APP}:latest

        docker tag ${COMPOSE_IMAGE_CADDY}:latest ${REGISTRY}/${COMPOSE_IMAGE_CADDY}:${SHORT_TAG}
        docker tag ${COMPOSE_IMAGE_CADDY}:latest ${REGISTRY}/${COMPOSE_IMAGE_CADDY}:latest
        docker push ${REGISTRY}/${COMPOSE_IMAGE_CADDY}:${SHORT_TAG}
        docker push ${REGISTRY}/${COMPOSE_IMAGE_CADDY}:latest

        docker tag ${COMPOSE_IMAGE_TAGGER}:latest ${REGISTRY}/${COMPOSE_IMAGE_TAGGER}:${SHORT_TAG}
        docker tag ${COMPOSE_IMAGE_TAGGER}:latest ${REGISTRY}/${COMPOSE_IMAGE_TAGGER}:latest
        docker push ${REGISTRY}/${COMPOSE_IMAGE_TAGGER}:${SHORT_TAG}
        docker push ${REGISTRY}/${COMPOSE_IMAGE_TAGGER}:latest
