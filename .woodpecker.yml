workspace:
  base: /woodpecker
  path: src/GITEA_HOST_REDACTED/${CI_REPO_OWNER}/${CI_REPO_NAME}

when:
  branch: [main, test-woodpecker]
  event: [push, manual]

labels:
  build-machine: true

steps:
  # - name: sync-to-github
  #   image: alpine/git
  #   environment:
  #     GITHUB_TOKEN:
  #       from_secret: github_token
  #   commands:
  #     - |
  #       set -e
  #       REMOTE_URL="https://${GITHUB_TOKEN}@github.com/GITHUB_USER_REDACTED/news-aggregator.git"
  #       echo "Using remote: ${REMOTE_URL#*@}"
  #       git remote rm github 2>/dev/null || true
