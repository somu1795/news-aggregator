# Redis configuration for the News Aggregator
# This is the single source of truth — mounted read-only by docker-compose.yml

# Listen on all interfaces within the Docker network
bind 0.0.0.0

# Disable protected mode since we're in a Docker network with no external exposure.
# Access control is enforced by Docker network isolation.
protected-mode no

port 6379
timeout 300
tcp-keepalive 60

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence — snapshot every 60s if at least 1000 keys changed
save 60 1000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data
