# Redis configuration for the News Aggregator
# This is the single source of truth — mounted read-only by docker-compose.yml

# Listen on all interfaces within the Docker network
bind 0.0.0.0

# Disable protected mode since we're in a Docker network with no external exposure.
# Access control is enforced by Docker network isolation.
protected-mode no

port 6379
timeout 300
tcp-keepalive 60

# Memory management
maxmemory 256mb
# Only evict keys that have a TTL (rate-limit counters, resolved URLs).
# The headlines snapshot has no TTL and must never be evicted.
maxmemory-policy volatile-lru

# Persistence — the snapshot survives restarts, so the API can serve
# headlines immediately after a reboot, before the first refresh finishes.
save 300 1
save 60 1000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data
