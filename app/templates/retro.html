<!DOCTYPE html>
<html lang="en" data-theme="{{ default_theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description }}">
    <title>{{ site.name }}</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- The card a shared link shows in chat apps and social sites -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.name }}">
    <meta property="og:title" content="{{ share.title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:url" content="{{ share.url }}">
    <meta property="og:image" content="{{ site_url }}og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ site.name }}: {{ site.description }}">
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">{{ {"@context": "https://schema.org", "@type": "WebSite", "name": site.name, "url": site_url,
        "description": site.description} | tojson }}</script>
    <meta name="theme-color" content="{{ '#120f0a' if default_theme == 'dark' else '#f3efe4' }}">
    <!-- Before the stylesheet: a browser holds an inline script back until the stylesheets above it have loaded -->
    <script id="views-data" type="application/json">{{ views | tojson }}</script>
    <script id="topics-data" type="application/json">{{ topics | tojson }}</script>
    <script id="home-data" type="application/json">{{ home_region | tojson }}</script>
    <script nonce="{{ csp_nonce }}">
        // The tab the page opens with, and its headlines asked for now: they download alongside the page's
        // scripts instead of after them. retro.js opens the same tab (firstTab) and takes this answer.
        (function () {
            function ids(id) { return JSON.parse(document.getElementById(id).textContent).map(function (v) { return v.id; }); }
            function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
            var views = ids("views-data"), topics = ids("topics-data"), home = JSON.parse(document.getElementById("home-data").textContent);
            if (views.indexOf(home) < 0) home = views[0];
            // A link's tab (?region=, ?topic=); else the last one viewed; else the visitor's region
            window.firstTab = function () {
                var params = new URLSearchParams(location.search);
                function valid(value, list) { return list.indexOf(value) >= 0 ? value : null; }
                if (params.has("region") || params.has("topic")) {
                    return { region: valid(params.get("region"), views) || views[0], topic: valid(params.get("topic"), topics) || topics[0] };
                }
                return { region: valid(read("retroRegion"), views) || home, topic: valid(read("retroTopic"), topics) || topics[0] };
            };
            window.headlinesUrl = function (region, topic) {
                return "/api/headlines?region=" + encodeURIComponent(region) + (topic === topics[0] ? "" : "&topic=" + encodeURIComponent(topic));
            };
            var tab = window.firstTab(), url = window.headlinesUrl(tab.region, tab.topic);
            var response = fetch(url, { headers: { "Accept": "application/json" } });
            response.catch(function () {});  // retro.js handles a failure; this only keeps it from being reported twice
            window.firstHeadlines = { url: url, response: response };
        })();
    </script>
    <link rel="stylesheet" href="{{ assets['retro.css'] }}" nonce="{{ csp_nonce }}">
    <script src="{{ assets['sky.js'] }}" nonce="{{ csp_nonce }}" defer></script>
    <script src="{{ assets['moonart.js'] }}" nonce="{{ csp_nonce }}" defer></script>
    <script src="{{ assets['retro.js'] }}" nonce="{{ csp_nonce }}" defer></script>
</head>
<body>
    <header>
        <div class="masthead">
            <h1>{{ site.name | upper }}<span class="cursor blink">_</span></h1>
            <a class="moon" id="moon" href="/moon"></a>
            <nav aria-label="Controls">
                <button id="refresh" title="Refresh (r)">[<span class="key">r</span>]efresh</button>
                <button id="theme" title="Toggle dark mode (d)">[<span class="key">d</span>]ark</button>
                <button id="sort" title="Order: mix, newest, oldest, random (s)">[<span class="key">s</span>]ort: <span id="sort-mode">mix</span></button>
                <button id="search-toggle" aria-controls="search" aria-expanded="false" title="Search every tab's headlines and summaries (/)">[<span class="key">/</span>]search</button>
                <button id="advanced-toggle" aria-controls="advanced" aria-expanded="false" title="More options (a)">[<span class="key">a</span>]dvanced</button>
                <a href="/stats/" title="World heatmap of the news">stats</a>
            </nav>
        </div>
        <nav class="advanced" id="advanced" aria-label="Advanced" hidden>
            <button id="reset" title="Forget every setting on this device: region, topic, sort, theme, bypass, site icons, auto refresh, back action, open summaries and sources">reset</button>
            <button id="install" title="Install {{ site.name }} as an app">install</button>
            <button id="site-icons" aria-pressed="true" title="Show each website's icon before its headlines">site icons: on</button>
            <button id="snap-toggle" title="A snap button under each open summary, which saves the headline and its summary as an image: image (and copies its link), url (its link as the caption when shared), text (copies the headline and its link, also the caption when shared), off">snap: image</button>
            <button id="auto-refresh" title="Refresh the open tab by itself: off, 5m, 15m, 30m, 1h">auto refresh: off</button>
            <button id="back-action" title="What the Back button does: exit the site, or return to the last tab">back action: exit</button>
            <span id="bypass" title="Open paywalled sites via a bypass service">bypass:</span>
            <span class="note" id="advanced-note" aria-live="polite"></span>
        </nav>
        <div class="search" id="search" role="search" hidden>
            <input id="search-input" type="search" placeholder="search headlines and summaries, older ones too" aria-label="Search headlines"
                autocomplete="off" spellcheck="false">
            <span class="note" id="search-note" aria-live="polite"></span>
        </div>
        <nav class="regions" id="regions" aria-label="Regions"></nav>
        <nav class="regions" id="topics" aria-label="Topics"></nav>
        <p class="status"><span id="status" aria-live="polite">connecting<span class="blink">...</span></span><span id="status-age"></span><span id="status-busy" aria-live="polite"></span></p>
        <hr class="rule">
    </header>

    <main>
        <ol id="list"></ol>
        <p class="notice" id="notice" hidden></p>
    </main>

    <footer>
        <hr class="rule">
        <p>-- end of transmission --</p>
    </footer>

    <script id="paywalled-data" type="application/json">{{ site.paywalled_hosts | tojson }}</script>
    <script id="moon-data" type="application/json">{{ moon | tojson }}</script>
</body>
</html>
