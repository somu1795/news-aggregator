<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Headlines from Asia, Europe, the Americas, Africa and Oceania, plus science and Hacker News. Updated every few minutes.">
    <title>news.txt</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#f3efe4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#120f0a" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="{{ assets['retro.css'] }}" nonce="{{ csp_nonce }}">
    <script src="{{ assets['retro.js'] }}" nonce="{{ csp_nonce }}" defer></script>
</head>
<body>
    <header>
        <div class="masthead">
            <h1>NEWS.TXT<span class="cursor blink">_</span></h1>
            <nav aria-label="Controls">
                <button id="refresh" title="Refresh (r)">[<span class="key">r</span>]efresh</button>
                <button id="theme" title="Toggle dark mode (d)">[<span class="key">d</span>]ark</button>
                <button id="sort" title="Order: mix, newest, oldest, random (s)">[<span class="key">s</span>]ort: <span id="sort-mode">mix</span></button>
                <button id="search-toggle" aria-controls="search" aria-expanded="false" title="Search every tab's headlines and summaries (/)">[<span class="key">/</span>]search</button>
                <button id="advanced-toggle" aria-controls="advanced" aria-expanded="false" title="More options (a)">[<span class="key">a</span>]dvanced</button>
            </nav>
        </div>
        <nav class="advanced" id="advanced" aria-label="Advanced" hidden>
            <button id="reset" title="Forget every setting on this device: region, topic, sort, theme, bypass, site icons, auto refresh, back action, open summaries and sources">reset</button>
            <button id="install" title="Install news.txt as an app">install</button>
            <button id="site-icons" aria-pressed="false" title="Show each website's icon before its headlines">site icons: off</button>
            <button id="auto-refresh" title="Refresh the open tab by itself: off, 5m, 15m, 30m, 1h">auto refresh: off</button>
            <button id="back-action" title="What the Back button does: exit the site, or return to the last tab">back action: exit</button>
            <span id="bypass" title="Open paywalled sites via a bypass service">bypass:</span>
            <span class="note" id="advanced-note" aria-live="polite"></span>
        </nav>
        <div class="search" id="search" role="search" hidden>
            <input id="search-input" type="search" placeholder="search every tab: headlines and summaries" aria-label="Search every tab"
                autocomplete="off" spellcheck="false">
            <span class="note" id="search-note" aria-live="polite"></span>
        </div>
        <nav class="regions" id="regions" aria-label="Regions"></nav>
        <nav class="regions" id="topics" aria-label="Topics"></nav>
        <p class="status"><span id="status" aria-live="polite">connecting<span class="blink">...</span></span><span id="status-age"></span><span id="status-busy" aria-live="polite"></span></p>
        <hr class="rule">
    </header>

    <main>
        <ol id="list"></ol>
        <p class="notice" id="notice" hidden></p>
    </main>

    <footer>
        <hr class="rule">
        <p>-- end of transmission --</p>
    </footer>

    <script id="views-data" type="application/json">{{ views | tojson }}</script>
    <script id="topics-data" type="application/json">{{ topics | tojson }}</script>
    <script id="paywalled-data" type="application/json">{{ paywalled | tojson }}</script>
    <script id="home-data" type="application/json">{{ home_region | tojson }}</script>
</body>
</html>
