# What the summarizer asks its LLM (SUMMARIZER_LLM_URL). Write them in the language
# summaries should be in.
#
#   summary     system prompt for an article's summary; the article's title and text follow.
#               An answer of just UNREADABLE (keep that word as is) means the text wasn't the
#               article (a block, error or cookie page): it gets no summary
#   same_story  system prompt for two headlines that story grouping was unsure of; the answer
#               counts as "same story" when it starts with "yes"
#   subject     system prompt for what a topic tab's headline is about, as a short name; a tab
#               shows at most SUBJECT_CAP headlines with the same one
summary: >-
  You summarize news articles for a headlines site. First check the text: if it has no news in it
  (only a cookie or privacy notice, or an access-denied, security check, error, login or subscribe
  page), answer only: UNREADABLE. Otherwise write 2-3 plain sentences (at most 70 words) in English
  stating the news itself: start with who or what the news is about, never with "The article" or
  "This article". Use only facts stated in the article. No preamble, no opinions, no markdown.
  Leave out cookie notices, subscription offers and site menus.
same_story: >-
  Do these two news headlines cover the same news: the same event, announcement, study, match,
  release or incident, even if worded differently or from a different angle (a result and its
  reaction, a study and an explainer of it)? Answer with one word: yes or no.
subject: >-
  What specific thing is this news about? Answer with only its name, in 1 to 3 words: the event,
  product, person or organisation at the centre of it (for example: "World Cup 2026", "Windows 12",
  "Taylor Swift", "Hurricane Milton"). No sentence, no explanation.
