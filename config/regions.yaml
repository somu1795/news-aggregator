# Regions: one tab each, in this order (after "All"). Their news sources are in sources.yaml.
#
#   id             lowercase letters; also the tab's address (?region=<id>)
#   label          the tab's name
#   countries      ISO 3166 codes, space-separated: a visitor from one of them (Cloudflare's
#                  CF-IPCountry header) starts on this tab; anyone else starts on "All"
#   places         names (countries, their people, cities, states) that put a story from a
#                  worldwide feed in this region's topic tabs; matched as whole words, any case.
#                  Leave out names that are also ordinary words (Turkey, Jordan, Chad, Victoria)
#   abbreviations  matched only as written (US, UK): in lowercase they're ordinary words
#
# A headline that names no place stays in every region's topic tabs.
