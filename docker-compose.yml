# Applied to every service: bounded logs, no privilege escalation, no Linux capabilities
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    init: true
    <<: *hardened
    image: news-aggregator-app
    build:
      context: ./app
      dockerfile: Dockerfile
    environment:
      # API_RATE_LIMIT: Controls requests per IP. Default is "100/minute".
      - API_RATE_LIMIT=${API_RATE_LIMIT:-100/minute}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS?You must set ALLOWED_HOSTS in your .env file}
      - ADMIN_API_KEY=${ADMIN_API_KEY?You must set ADMIN_API_KEY in your .env file}
      # One worker per CPU in APP_CPUS. Benchmarked: 4 workers on 4 CPUs match
      # 9 workers' throughput at half the memory; scale out with more containers.
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - LOG_LEVEL=INFO
      # Lets /metrics aggregate all Uvicorn workers (see app/entrypoint.sh)
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus-metrics
    # The code is already baked into the image via the Dockerfile's COPY command.
    # For production and fast startup, we use the internal copy.
    # For development, you can uncomment the lines below to live-mount your local code.
    # volumes:
    #   - ./app:/app:ro
    deploy:
      resources:
        # These are resource limits per container. To handle very high traffic (10k+ users),
        # you should scale horizontally by running more containers (e.g., `docker-compose up --scale app=3`).
        limits:
          cpus: '${APP_CPUS:-4}'
          memory: ${APP_MEM_LIMIT:-2G}
          pids: 512
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 10s   # Check every 10 seconds
      timeout: 5s
      retries: 3
      start_period: 10s # Grace period for startup before retries are counted
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # Fetches feeds on a schedule and publishes snapshots to Redis. Run exactly
  # one replica; the API never fetches upstream itself.
  refresher:
    init: true
    <<: *hardened
    image: news-aggregator-app
    build:
      context: ./app
      dockerfile: Dockerfile
    entrypoint: ["python", "refresher.py"]
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - LOG_LEVEL=INFO
    volumes:
      # Edit sources.json and `docker compose restart refresher` — no rebuild needed.
      - ./app/sources.json:/app/sources.json:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
          pids: 256
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # Summarizes the top articles of every view (see app/summarizer.py) with an
  # Ollama server at SUMMARIZER_LLM_URL; without one it does nothing.
  summarizer:
    init: true
    <<: *hardened
    image: news-aggregator-app
    entrypoint: ["python", "summarizer.py"]
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - LOG_LEVEL=INFO
      - SUMMARIZER_LLM_URL=${SUMMARIZER_LLM_URL:-}
      - SUMMARIZER_MODEL=${SUMMARIZER_MODEL:-qwen3:8b}
      - SUMMARIZER_BROWSER_URL=http://browser:8191
      - SUMMARIZER_BROWSER_PROXY=http://browser-egress:4750
      - SUMMARIZER_BROWSER2_URL=http://browser2:8191
    volumes:
      - ./app/sources.json:/app/sources.json:ro
    networks: [default, browser]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 384M
          pids: 256
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # Headless Chromium (FlareSolverr) that reads articles from sites whose bot checks
  # refuse plain requests. Pages run their own JavaScript, so it is cut off from
  # everything: it sits only on the internal `browser` network (no internet, no LAN,
  # no other containers but the summarizer and its proxy), and the summarizer has it
  # load every page through browser-egress.
  browser:
    init: true
    <<: *hardened
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    environment:
      - LOG_LEVEL=warning
      - TZ=UTC
    networks: [browser]
    shm_size: 256m  # Chromium's shared memory; Docker's default 64 MB crashes tabs
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
          pids: 512
    restart: unless-stopped

  # A second headless browser (Byparr, a modified Firefox; same API as FlareSolverr),
  # tried when the first fails: it gets past some bot checks the first doesn't, but
  # is slower. Same isolation as `browser`: the internal network, and every page and
  # its own downloads (a GeoIP database, at start) through browser-egress.
  browser2:
    <<: *hardened
    image: ghcr.io/thephaseless/byparr:3.0.4
    environment:
      - PROXY_SERVER=http://browser-egress:4750
      - HTTPS_PROXY=http://browser-egress:4750
      - HTTP_PROXY=http://browser-egress:4750
      - NO_PROXY=localhost,127.0.0.1
      # Fixed, so it doesn't look up its public IP to pick them
      - BROWSER_LOCALE=en-US
      - BROWSER_TIMEZONE=UTC
    networks: [browser]
    volumes:
      - browser2_cache:/cache  # The GeoIP database, kept across restarts
    tmpfs:
      - /tmp:size=256m  # Its many temporary files stay in memory (counted in the limit)
    shm_size: 512m
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
          pids: 512
    restart: unless-stopped

  # The browser's only way out: an HTTP(S) proxy (Smokescreen) that connects to public
  # internet addresses only. It refuses private, loopback, link-local, Docker and
  # Tailscale/CGNAT (100.64.0.0/10) addresses, also after DNS and at every redirect,
  # so no page can reach the LAN, the tailnet or this host.
  browser-egress:
    init: true
    <<: *hardened
    image: news-aggregator-smokescreen
    build: ./smokescreen
    command: ["--listen-ip", "0.0.0.0", "--listen-port", "4750", "--timeout", "30s"]
    networks: [browser, egress]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
          pids: 128
    restart: unless-stopped

  # Tags headlines by topic for the topic views (see tagger/tagger.py), on the
  # host's Intel NPU. On a host without one (no /dev/accel), remove `devices`
  # and `group_add` and it runs on the CPU.
  tagger:
    init: true
    <<: *hardened
    image: news-aggregator-tagger
    build: ./tagger
    devices:
      - /dev/accel:/dev/accel
    group_add:
      # The host group that owns /dev/accel/accel0 (`getent group render`); a number, as
      # the container doesn't know the host's group names
      - "${RENDER_GID:-991}"
    volumes:
      - tagger_data:/data  # Stored headlines (SQLite), the classifier, the NPU compile cache
    deploy:
      resources:
        limits:
          cpus: '2'
          # Two models (topics, and story grouping); measured use is in ARCHITECTURE.md §6
          memory: 2G
          pids: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s  # The first start compiles the model for the NPU and trains (~1.5 min)
    restart: unless-stopped

  caddy:
    init: true
    <<: *hardened
    # The caddy binary carries this file capability; without it the kernel refuses to run it
    cap_add: [NET_BIND_SERVICE]
    image: news-aggregator-caddy
    build: ./caddy
    ports:
      # Expose Caddy's HTTP port on all network interfaces so it can be accessed
      # from other machines on the network (e.g., your browser or Nginx Proxy Manager).
      - "${CADDY_HTTP_PORT:-7001}:7001"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
          pids: 256
    restart: unless-stopped

  # Cloudflare Tunnel: an outbound connection to Cloudflare, which serves the site
  # (no inbound port needed). In the tunnel's Public Hostname, point the site at
  # http://caddy:7001. Started only with COMPOSE_PROFILES=cloudflare in .env.
  # Two connectors on the same tunnel, pinned separately, so an upgrade can replace
  # one while the other serves: scripts/upgrade-cloudflared.sh <version>.
  cloudflared: &cloudflared
    image: cloudflare/cloudflared:2026.10.0
    <<: *hardened
    profiles: [cloudflare]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    # cloudflared finishes in-flight requests for up to 30s when stopped (its --grace-period);
    # Docker would kill it after 10s
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
          pids: 64
    restart: unless-stopped
    depends_on:
      - caddy

  cloudflared-b:
    <<: *cloudflared
    image: cloudflare/cloudflared:2026.10.0

  redis:
    image: redis:8.10.2-alpine
    <<: *hardened
    # Its entrypoint chowns /data and switches to the redis user
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD?You must set REDIS_PASSWORD in your .env file}  # For the healthcheck's redis-cli
    # Must start with redis-server: only then does the image's entrypoint switch to the redis user
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 640M # Set a hard limit above Redis's maxmemory (512mb in redis.conf)
          pids: 128

networks:
  default:
  # The browser's network: internal, so nothing on it reaches the internet directly
  browser:
    internal: true
  # browser-egress's way out, shared with nothing else
  egress:

volumes:
  browser2_cache:
  tagger_data:
  redis_data:
  caddy_data:
  caddy_config:
